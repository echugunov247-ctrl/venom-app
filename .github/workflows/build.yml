name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Increase Swap
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 6

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 virtualenv

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: venom-apk
        path: bin/*.apk
